[workspace]
resolver = "3"
members = ["crates/egaku-core", "crates/egaku"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
egaku-core = { path = "crates/egaku-core" }
rayon = "1.12"

# Pixel loops are unusably slow without optimisation, so even debug builds
# optimise the core and all dependencies. Only the app crate itself stays
# quick to rebuild.
[profile.dev.package.egaku-core]
opt-level = 3
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
