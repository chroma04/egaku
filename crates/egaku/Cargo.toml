[package]
name = "egaku"
description = "A minimal, fast raster painting app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
egaku-core = { workspace = true, features = ["serde"] }
rayon.workspace = true
eframe = { version = "0.37", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts", "persistence", "accesskit"] }
serde = { version = "1", features = ["derive"] }
rfd = "0.18"
egui-pop-phosphor = "0.15"
octotablet = { version = "0.1", optional = true }

[features]
default = ["tablet"]
# Pen pressure, tilt and eraser via the platform tablet API (Wayland, Windows Ink).
tablet = ["dep:octotablet"]
