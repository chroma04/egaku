[package]
name = "egaku"
description = "A minimal, fast raster painting app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
egaku-core = { workspace = true, features = ["serde"] }
rayon.workspace = true
eframe = { version = "0.37", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts", "persistence", "accesskit", "clipboard"] }
# Reads images from the system clipboard on demand (eframe only offers them
# when the clipboard holds no text).
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
serde = { version = "1", features = ["derive"] }
rfd = "0.18"
egui-pop-phosphor = "0.15"

# Platform tablet APIs: Wayland and Windows Ink through octotablet; on macOS
# AppKit reports pen pressure on its own events.
[target.'cfg(any(windows, all(unix, not(target_os = "macos"))))'.dependencies]
octotablet = { version = "0.1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "block2"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
default = ["tablet"]
# Pen pressure and the eraser end via the platform tablet API.
tablet = ["dep:octotablet"]
